name: Security Checks

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual runs

# Prevent multiple runs for same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # JOB 1: Gitleaks - Secret Scanning
  # ============================================================================
  gitleaks:
    name: Scan for Secrets (Gitleaks)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better detection
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

  # ============================================================================
  # JOB 2: Semgrep - Code Security Analysis
  # ============================================================================
  semgrep:
    name: Security Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Run Semgrep Security Scan
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/secrets \
            --error

  # ============================================================================
  # JOB 3: Checkov - Infrastructure as Code Security
  # ============================================================================
  checkov:
    name: Infrastructure Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Run Checkov
        run: |
          docker run --rm -v "${PWD}:/tf" \
            bridgecrew/checkov \
            --directory /tf \
            --framework dockerfile \
            --framework kubernetes \
            --framework terraform \
            --framework github_actions \
            --quiet \
            --compact

  # ==========================================================================
  # Summary - Ensure all passed
  # ==========================================================================
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [gitleaks, semgrep, checkov]
    if: always()
    steps:
      - name: Check all scans passed
        run: |
          echo "Gitleaks: ${{ needs.gitleaks.result }}"
          echo "Semgrep:  ${{ needs.semgrep.result }}"
          echo "Checkov:  ${{ needs.checkov.result }}"
          
          if [ "${{ needs.gitleaks.result }}" != "success" ] || \
             [ "${{ needs.semgrep.result }}" != "success" ] || \
             [ "${{ needs.checkov.result }}" != "success" ]; then
            echo "Security checks failed!"
            exit 1
          fi
          
          echo "All security checks passed!"