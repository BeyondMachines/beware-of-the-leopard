name: Security Checks

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual runs

# ============================================================================
# SECURITY: Explicitly set minimal permissions (Principle of Least Privilege)
# ============================================================================
permissions:
  contents: read       # Read repository contents
  pull-requests: read  # Read PR metadata (needed for PR context)

# Prevent multiple runs for same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Gitleaks - Using Docker (no license required)
  # ==========================================================================
  gitleaks:
    name: Gitleaks Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run Gitleaks
        run: |
          docker run -v ${PWD}:/path zricethezav/gitleaks:latest \
            detect --source="/path" -v --no-git


  # ============================================================================
  # JOB 2: Semgrep - Code Security Analysis
  # ============================================================================
  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Run Semgrep Security Scan
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/secrets \
            --error

  # ============================================================================
  # JOB 3: Checkov - Infrastructure as Code Security
  # ============================================================================
  checkov:
    name: Checkov Infrastructure Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Run Checkov
        run: |
          docker run --rm -v "${PWD}:/tf" \
            bridgecrew/checkov \
            --directory /tf \
            --framework dockerfile \
            --framework kubernetes \
            --framework terraform \
            --framework github_actions \
            --quiet \
            --compact